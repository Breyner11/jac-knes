<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E1022E">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JAC-KNES">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>JAC-KNES · Club Canino Campestre</title>
<!--PWA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="stylesheet" href="styles.css">
<!--/PWA-->
</head>
<body>

<!-- Inicio / entrar -->
<div id="vStart" class="splash">
  <img class="logo" src="img/logo.png" alt="Club Canino Campestre JAC-KNES">
  <div class="dots" id="startDots"><i></i><i></i><i></i></div>
  <div class="msg hidden" id="startMsg"></div>
  <div class="pin hidden" id="pinBox">
    <div class="pin-t" id="pinTitulo">Escribe el PIN</div>
    <div class="pin-dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="pin-err" id="pinErr" role="alert"></div>
    <div class="pin-pad" id="pinPad">
      <button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button>
      <button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button>
      <button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button>
      <span></span><button data-d="0">0</button><button class="borrar" id="pinBorrar" aria-label="Borrar">⌫</button>
    </div>
  </div>
  <button class="retry hidden" id="startRetry">Reintentar</button>
  <button class="alt hidden" id="startPin">Escribir el PIN otra vez</button>
</div>

<!-- Lista -->
<div id="vList" class="screen hidden">
  <div class="top">
    <div class="brand"><img class="logo" src="img/logo.png" alt="Club Canino Campestre JAC-KNES"></div>
    <div class="bar">
      <input id="q" class="search" type="search" placeholder="Buscar perro, dueño o dirección" autocomplete="off">
      <div class="stats" id="stats"></div>
    </div>
  </div>
  <div class="tools">
    <button id="bHoy">📋 Hoy</button>
    <button id="bMes">📊 Mes</button>
    <button id="bAgregar" class="primary">＋ Agregar perro</button>
  </div>
  <div class="modos" id="modos"></div>
  <div id="hotelBox"></div>
  <div id="groups"></div>
  <div class="foot" id="foot"></div>
</div>

<!-- Detalle -->
<div id="vDet" class="screen hidden">
  <div class="nav"><button class="back" id="backBtn">‹ Perros</button><img class="mini-logo" src="icons/apple-touch-icon.png" alt=""></div>
  <div id="det"></div>
</div>

<!-- Hoy / historial del día -->
<div id="vHoy" class="screen hidden">
  <div class="nav"><button class="back" data-volver>‹ Perros</button><img class="mini-logo" src="icons/apple-touch-icon.png" alt=""></div>
  <div class="vtit">Registro del día</div>
  <div class="diabar">
    <button id="diaPrev" aria-label="Día anterior">‹</button>
    <input type="date" id="diaIn" aria-label="Fecha">
    <button id="diaNext" aria-label="Día siguiente">›</button>
    <button id="diaHoy" class="tlink">Hoy</button>
  </div>
  <div id="hoyBody"></div>
</div>

<!-- Resumen del mes -->
<div id="vMes" class="screen hidden">
  <div class="nav"><button class="back" data-volver>‹ Perros</button><img class="mini-logo" src="icons/apple-touch-icon.png" alt=""></div>
  <div class="vtit">Resumen del mes</div>
  <div class="mesnav"><button id="rmPrev" aria-label="Mes anterior">‹</button><div class="sect" id="rmTit"></div><button id="rmNext" aria-label="Mes siguiente">›</button></div>
  <div id="mesBody"></div>
</div>

<!-- Agregar / editar perro -->
<div id="vForm" class="screen hidden">
  <div class="nav"><button class="back" id="formVolver">‹ Volver</button><img class="mini-logo" src="icons/apple-touch-icon.png" alt=""></div>
  <div id="formBody"></div>
</div>

<!-- Hotel 24H -->
<div id="vHotel" class="screen hidden">
  <div class="nav"><button class="back" data-volver>‹ Perros</button><img class="mini-logo" src="icons/apple-touch-icon.png" alt=""></div>
  <div class="vtit">🏨 Hotel 24H</div>
  <div class="nota" style="margin:0 16px 8px">Perros que se quedan en el hotel todo el tiempo.</div>
  <div id="h24Body"></div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="mbox"><div class="mt" id="modalTit"></div><div class="mtx" id="modalTxt"></div>
    <div class="mbtns"><button id="modalNo">Cancelar</button><button id="modalSi" class="danger">Aceptar</button></div></div>
</div>

<input id="fotoIn" type="file" accept="image/*" class="hidden">
<input id="fotoNuevo" type="file" accept="image/*" class="hidden">
<div id="toast" class="toast hidden"><div id="toastMsg" class="grow"></div><button id="toastUndo">Deshacer</button></div>
<div id="loading" class="loading hidden"><div class="spin"></div></div>

<!--PWA-->
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="ui.js"></script>
<script src="pwa.js"></script>
<!--/PWA-->
</body>
</html>
